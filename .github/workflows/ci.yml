name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - run: go fmt ./... && git diff --exit-code   # fail if formatting is off
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/stygai-status ./cmd/notify